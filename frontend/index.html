<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mennekes Smart Charge</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            max-width: 600px;
            width: 100%;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 32px;
            color: white;
            font-weight: 700;
            margin: 0;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h2 {
            margin-bottom: 16px;
            color: #333;
            font-size: 20px;
        }

        .status-display {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .status-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: #f7f7f7;
            border-radius: 8px;
        }

        .status-label {
            font-weight: 500;
            color: #666;
        }

        .status-value {
            font-weight: 600;
            font-size: 18px;
        }

        .status-value.idle {
            color: #666;
        }

        .status-value.charging {
            color: #10b981;
        }

        .power-value,
        .energy-value,
        .duration-value {
            color: #667eea;
        }

        .status-value.authorized {
            color: #10b981;
        }

        .status-value.not-authorized {
            color: #ef4444;
        }

        .status-value.surplus {
            color: #10b981;
        }

        .status-value.importing {
            color: #ef4444;
        }

        .mode-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .mode-btn {
            padding: 16px;
            border: 2px solid #e5e7eb;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 16px;
            font-weight: 500;
            color: #333;
        }

        .mode-btn:hover {
            border-color: #667eea;
            background: #f9fafb;
        }

        .mode-btn.active {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }

        .mode-btn:active {
            transform: scale(0.98);
        }

        .mode-description {
            margin-top: 16px;
            padding: 12px;
            background: #f0f4ff;
            border-left: 3px solid #667eea;
            border-radius: 4px;
            color: #555;
            font-size: 14px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Mennekes Smart Charge</h1>
        </header>

        <!-- Card 1: Charging Mode -->
        <div class="card">
            <h2>Charging Mode</h2>
            <div class="mode-buttons">
                <button class="mode-btn" data-mode="solar_only">Solar Only</button>
                <button class="mode-btn" data-mode="grid_support">Grid Support</button>
                <button class="mode-btn" data-mode="boost">Boost</button>
            </div>
            <div class="mode-description" id="modeDescription">
                Loading...
            </div>
        </div>

        <!-- Card 2: Grid/Solar Status -->
        <div class="card">
            <h2>Grid/Solar Status</h2>
            <div class="status-display">
                <div class="status-item">
                    <span class="status-label">Current Grid Flow</span>
                    <span class="status-value importing" id="currentGridFlow">+0.7 kW</span>
                </div>
                <div class="status-item">
                    <span class="status-label">Avg. Net Flow (5m)</span>
                    <span class="status-value surplus" id="avgNetFlow">-2.5 kW</span>
                </div>
            </div>
        </div>

        <!-- Card 3: Charger Status -->
        <div class="card">
            <h2>Charger Status</h2>
            <div class="status-display">
                <div class="status-item">
                    <span class="status-label">Authorization</span>
                    <span class="status-value not-authorized" id="authStatus">Not Authorized</span>
                </div>
                <div class="status-item">
                    <span class="status-label">State</span>
                    <span class="status-value charging" id="chargerState">Charging</span>
                </div>
                <div class="status-item">
                    <span class="status-label">Power</span>
                    <span class="status-value power-value" id="powerValue">0.0 kW</span>
                </div>
                <div class="status-item">
                    <span class="status-label">Target Current</span>
                    <span class="status-value power-value" id="targetCurrent">0.0 A</span>
                </div>
                <div class="status-item">
                    <span class="status-label">Energy Transferred</span>
                    <span class="status-value energy-value" id="energyValue">0.0 kWh</span>
                </div>
                <div class="status-item">
                    <span class="status-label">Duration</span>
                    <span class="status-value duration-value" id="durationValue">0h 0m</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Mode descriptions (make global for app.js)
        window.modeDescriptions = {
            solar_only: 'Only charge when this is possible without importing power from the grid, automatically adjusts power to use solar surplus.',
            grid_support: 'Always charge with minimum power, automatically adjusts power to use solar surplus while supplementing from the grid as needed.',
            boost: 'Charge at maximum power regardless of solar surplus.'
        };

        // Mock charger state updates (replace with actual API calls)
        function updateChargerState(state, power = null, energy = null, duration = null) {
            const stateElement = document.getElementById('chargerState');

            stateElement.textContent = state.charAt(0).toUpperCase() + state.slice(1);
            stateElement.className = `status-value ${state}`;

            if (power !== null) {
                document.getElementById('powerValue').textContent = `${power} kW`;
            }
            if (energy !== null) {
                document.getElementById('energyValue').textContent = `${energy} kWh`;
            }
            if (duration !== null) {
                document.getElementById('durationValue').textContent = duration;
            }
        }

        // Update energy transferred
        function updateEnergy(energy) {
            document.getElementById('energyValue').textContent = `${energy} kWh`;
        }

        // Update duration
        function updateDuration(duration) {
            document.getElementById('durationValue').textContent = duration;
        }

        // Update authorization status
        function updateAuthStatus(authorized) {
            const authElement = document.getElementById('authStatus');

            if (authorized) {
                authElement.textContent = 'Authorized';
                authElement.className = 'status-value authorized';
            } else {
                authElement.textContent = 'Not Authorized';
                authElement.className = 'status-value not-authorized';
            }
        }

        // Update current grid flow (negative = surplus/exporting, positive = importing)
        function updateCurrentGridFlow(netFlow) {
            const element = document.getElementById('currentGridFlow');

            // Format with sign and 2 decimals
            const formatted = (netFlow >= 0 ? '+' : '') + netFlow.toFixed(2) + ' kW';
            element.textContent = formatted;

            // Color: green for surplus (negative), red for importing (positive)
            if (netFlow < 0) {
                element.className = 'status-value surplus';
            } else {
                element.className = 'status-value importing';
            }
        }

        // Update average net flow (negative = surplus/exporting, positive = importing)
        function updateAvgNetFlow(netFlow) {
            const avgElement = document.getElementById('avgNetFlow');

            // Format with sign and 2 decimals
            const formatted = (netFlow >= 0 ? '+' : '') + netFlow.toFixed(2) + ' kW';
            avgElement.textContent = formatted;

            // Color: green for surplus (negative), red for importing (positive)
            if (netFlow < 0) {
                avgElement.className = 'status-value surplus';
            } else {
                avgElement.className = 'status-value importing';
            }
        }

        // Example: updateChargerState('idle');
        // Example: updateChargerState('charging', 7.2, 12.5, '3h 45m');
        // Example: updateEnergy(15.3);
        // Example: updateDuration('2h 15m');
        // Example: updateAuthStatus(true);
        // Example: updateAuthStatus(false);
        // Example: updateCurrentGridFlow(0.7);  // importing
        // Example: updateCurrentGridFlow(-3.2); // surplus
        // Example: updateAvgNetFlow(-2.5); // surplus
        // Example: updateAvgNetFlow(1.3);  // importing
    </script>

    <!-- Socket.IO client -->
    <script src="/socket.io/socket.io.js"></script>
    <!-- Application logic -->
    <script src="/app.js"></script>
</body>
</html>
